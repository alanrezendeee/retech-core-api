services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core
      POSTGRES_DB: retech_core
    ports:
      - "5433:5432"
    volumes:
      - retech_core_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d retech_core"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://core:core@postgres:5432/retech_core?sslmode=disable
      HTTP_ADDR: ":8080"
      GIN_MODE: release
      LOG_LEVEL: info
    ports:
      - "8080:8080"

volumes:
  retech_core_pg:
